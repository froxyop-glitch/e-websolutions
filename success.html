<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission received | e-WebSolutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell success-page">
        <header class="site-header">
            <a class="brand" href="index.html"><img src="icon-192.png" alt="e-WebSolutions logo"><span>e-WebSolutions</span></a>
        </header>
        <main class="success-content">
            <div class="success-icon" aria-hidden="true">✓</div>
            <p class="eyebrow"><span></span> Entry received</p>
            <h1>Thank you for<br><em>creating.</em></h1>
            <p id="success-copy">Your Independence Day competition entry is ready for review.</p>
            <a class="back-link" href="index.html">← Submit another project</a>
        </main>
        <footer>e-WebSolutions <span>•</span> Celebrating creativity, unity and freedom.</footer>
    </div>
    <script>
        const submission = JSON.parse(localStorage.getItem('competitionSubmission') || 'null');
        if (submission) {
            document.querySelector('#success-copy').textContent = `Thanks, ${submission.name}. “${submission.title}” has been submitted for review.`;
        }
    </script>
</body>
</html>
